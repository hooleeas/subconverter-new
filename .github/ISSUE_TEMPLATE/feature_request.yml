name: Feature request
description: Suggest an improvement for this project
title: "[Feature] <title>"
body:
  - type: checkboxes
    id: ensure
    attributes:
      label: Verify
      description: Please confirm the following before submitting.
      options:
        - label: I have read the project documentation and confirmed that the current features do not meet my needs.
          required: true
        - label: I have searched existing issues and confirmed that this request is not a duplicate.
          required: true
        - label: I have tried to solve this myself.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem, requested capability, and current behavior.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe your expected solution, implementation ideas, or examples.
    validations:
      required: false
